name: Temporary v1417 Live Preview Source Qualification
on:
  push:
    branches:
      - release/forum-live-header-unify-001-v1417-preview
    paths:
      - .github/workflows/live-header-asset-rebuild.yml
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Install, build and unit-qualify release lineage
        working-directory: js
        run: |
          npm ci
          npm run build
          node --test tests/*.test.mjs
      - name: Commit only built assets
        run: |
          set -euo pipefail
          git add js/dist
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: refresh v1.4.17 Live preview dist [skip ci]"
          git push origin HEAD:refs/heads/release/forum-live-header-unify-001-v1417-preview
