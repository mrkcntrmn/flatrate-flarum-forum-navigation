name: Temporary dist rebuild

on:
  push:
    branches:
      - feat/forum-nav-ui-003-r2-current-main

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/forum-nav-ui-003-r2-current-main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Install JS dependencies
        working-directory: js
        run: npm ci
      - name: Build tracked assets
        working-directory: js
        run: npm run build
      - name: Commit regenerated dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/dist/forum.js js/dist/forum.js.map js/dist/admin.js js/dist/admin.js.map
          if git diff --cached --quiet; then
            echo "Dist already current."
            exit 0
          fi
          git commit -m "build: regenerate quick-rail dist on current main"
          git push origin HEAD:feat/forum-nav-ui-003-r2-current-main
